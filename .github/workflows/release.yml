name: Release

# Builds the Windows version: runs the tests, exports LadderLab.exe and zips it
# with the license.
# - Pushing a version tag (v0.2.1, the version in project.godot) publishes the
#   zip as a GitHub release, with that version's notes from CHANGELOG.md. A
#   release created on GitHub (Releases > Draft a new release, new tag) runs it
#   too: the zip is added, and an empty title and description are filled in.
#   If that run does not start, run the workflow by hand on the tag.
# - Started by hand (Actions > Release > Run workflow) on main with "Publish"
#   ticked, it creates the tag v<version> itself and publishes the release.
#   Without "Publish" it only builds; the zip is kept with the run (Artifacts)
#   for trying it out.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in project.godot as a release (creates the tag v<version>; main only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Engine the project is made with (keep in step with project.godot).
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          if [[ -z "$version" ]]; then
            echo "::error::No config/version in project.godot."
            exit 1
          fi
          echo "LadderLab $version"
          publish=false
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the version in project.godot ($version): the tag must be $tag."
              exit 1
            fi
            publish=true
          elif [[ "$PUBLISH_INPUT" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Releases are published from main only (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
              echo "::error::$tag is already released. Raise the version in project.godot first."
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines under "## <version> – <date>" up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes for $VERSION. Rename \"## Unreleased\" to \"## $VERSION – <date>\" (and add a new empty Unreleased above it) before tagging."
            exit 1
          fi
          cat notes.md

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-template

      - name: Download Godot and the Windows export template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Only the Windows template of the 1.3 GB archive is needed.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$templates"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Run the tests
        run: ~/godot/godot --headless -s addons/gut/gut_cmdln.gd

      - name: Export LadderLab.exe
        run: |
          mkdir -p build
          ~/godot/godot --headless --export-release "Windows Desktop" build/LadderLab.exe
          test -f build/LadderLab.exe

      - name: Zip it with the license
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="LadderLab-${VERSION}-win64"
          mkdir -p "dist/$name"
          cp build/LadderLab.exe "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          (cd dist && zip -q -r -9 "$name.zip" "$name")
          echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Keep the zip with the run
        uses: actions/upload-artifact@v4
        with:
          name: LadderLab-${{ steps.version.outputs.version }}-win64
          path: ${{ steps.zip.outputs.file }}
          retention-days: 14

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.zip.outputs.file }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Created on GitHub (which also pushes the tag): add the zip, and the
            # title and changelog notes when they were left empty there.
            gh release upload "$TAG" "$ZIP" --clobber
            title=$(gh release view "$TAG" --json name --jq .name)
            body=$(gh release view "$TAG" --json body --jq .body)
            if [[ -z "$title" || "$title" == "$TAG" ]]; then
              gh release edit "$TAG" --title "LadderLab $VERSION"
            fi
            if [[ -z "${body//[[:space:]]/}" ]]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            # "1.0.0-beta1" and the like are published as pre-releases, which
            # the update check in the program ignores.
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            # The tag is created on the built commit when it does not exist yet.
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "LadderLab $VERSION" --notes-file notes.md "${prerelease[@]}"
          fi
