<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e37"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb27e"/>
      <stop offset="1" stop-color="#d8693d"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M56 28V52L39 87.7Q36 94 43 94H85Q92 94 89 87.7L72 52V28Z"/>
    </clipPath>
  </defs>
  <!-- hexagon, corners rounded by a stroke of the same fill -->
  <path d="M64 8L112.5 36V92L64 120L15.5 92V36Z" fill="url(#hex)" stroke="url(#hex)" stroke-width="10" stroke-linejoin="round"/>
  <!-- flask contents -->
  <rect x="20" y="70" width="90" height="30" fill="url(#liquid)" clip-path="url(#inside)"/>
  <!-- ladder rungs in the neck -->
  <path d="M56 36H72M56 45H72" fill="none" stroke="#e8eaef" stroke-width="3.5" stroke-linecap="round"/>
  <!-- flask outline -->
  <path d="M56 28V52L39 87.7Q36 94 43 94H85Q92 94 89 87.7L72 52V28" fill="none" stroke="#e8eaef" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
